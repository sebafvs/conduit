upstream teamserver {
    server __TEAMSERVER_HOST__:__TEAMSERVER_PORT__;
    keepalive 32;
}

upstream payload {
    server __TEAMSERVER_HOST__:443;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    set $redir_reject "-";

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2  on;
    server_name _;

    ssl_certificate     /etc/openresty/certs/redirector.crt;
    ssl_certificate_key /etc/openresty/certs/redirector.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    more_set_headers "Server: cloudflare";

    set $redir_reject "wrong-sni";

    return 302 __DECOY_URL__;
}

server {
    listen 443 ssl;
    http2  on;
    server_name __REDIRECTOR_DOMAIN__;

    ssl_certificate     /etc/openresty/certs/redirector.crt;
    ssl_certificate_key /etc/openresty/certs/redirector.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    more_set_headers "Server: cloudflare";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    ssl_stapling        off;

    limit_req zone=redirlimit burst=10 nodelay;

    set $redir_reject "-";

    access_by_lua_file /etc/openresty/lua/filter.lua;

    location / {
        proxy_pass              https://teamserver;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;
        proxy_set_header        X-Request-ID      $req_id;
        proxy_set_header        Connection        "";

        proxy_ssl_verify            off;
        proxy_ssl_server_name       on;
        proxy_ssl_name              __TEAMSERVER_HOST__;

        proxy_read_timeout      75s;
        proxy_connect_timeout   10s;
    }

    location /payload/ {
        access_by_lua_block { return }

        proxy_pass              https://payload/;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_ssl_verify        off;
        proxy_ssl_server_name   on;
    }
}
