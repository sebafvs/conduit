user  nobody nogroup;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log  /var/log/openresty/error.log  notice;

events {
    worker_connections 4096;
    multi_accept       on;
    use                epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    lua_package_path "/etc/openresty/lua/?.lua;;";

    lua_shared_dict allow_sni  1m;
    lua_shared_dict allow_uri  1m;
    lua_shared_dict allow_ua   1m;
    lua_shared_dict allow_ja3  1m;
    lua_shared_dict require_headers 1m;
    lua_shared_dict rate_state 10m;

    init_by_lua_file /etc/openresty/lua/load-lists.lua;

    resolver 10.40.40.1 1.1.1.1 valid=30s ipv6=off;

    server_tokens off;
    more_clear_headers 'Server';

    # OPSEC: drop $remote_addr and $remote_user from access.log so the
    # beacon source IP never lands on disk in the first place. Keeps the
    # rest of the format (request, status, UA, reject reason, upstream
    # latency) for engineering visibility. See CONDUIT-001.
    log_format redirector '- - [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'reject=$redir_reject upstream=$upstream_response_time';

    access_log /var/log/openresty/access.log redirector;

    client_header_timeout  10s;
    client_body_timeout    10s;
    send_timeout           30s;
    keepalive_timeout      30s;
    keepalive_requests     1000;

    client_max_body_size   8m;
    client_body_buffer_size 128k;

    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;

    gzip               on;
    gzip_types         text/plain application/json;
    gzip_min_length    1024;
    gzip_proxied       off;

    limit_req_zone $binary_remote_addr zone=redirlimit:10m rate=60r/m;
    limit_req_status 429;

    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    include /etc/openresty/conf.d/*.conf;
}
