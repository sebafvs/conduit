[sshd]
enabled = false

[redir-decoy]
enabled    = true
port       = http,https
protocol   = tcp
filter     = redir-decoy
logpath    = /var/log/openresty/access.log
maxretry   = 5
findtime   = 60
bantime    = 3600
banaction  = nftables[type=multiport]

[redir-429]
enabled    = true
port       = http,https
protocol   = tcp
filter     = redir-429
logpath    = /var/log/openresty/access.log
maxretry   = 3
findtime   = 300
bantime    = 86400
banaction  = nftables[type=multiport]
