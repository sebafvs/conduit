---

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install relay packages
  ansible.builtin.apt:
    name: "{{ relay_packages }}"
    state: present
  become: true

- name: Install nftables
  ansible.builtin.apt:
    name:
      - nftables
    state: present
  become: true
