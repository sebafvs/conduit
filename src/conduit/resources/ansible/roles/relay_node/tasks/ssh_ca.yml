---

- name: Create /etc/ssh/ca directory
  ansible.builtin.file:
    path: /etc/ssh/ca
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy SSH CA public key
  ansible.builtin.copy:
    content: "{{ relay_ssh_ca_pubkey }}"
    dest: /etc/ssh/ca/c2-ca.pub
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart sshd
  when: relay_ssh_ca_pubkey | length > 0

- name: Configure TrustedUserCAKeys in sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?TrustedUserCAKeys'
    line: 'TrustedUserCAKeys /etc/ssh/ca/c2-ca.pub'
    state: present
  become: true
  notify: restart sshd

- name: Disable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  become: true
  notify: restart sshd

# OPSEC (CONDUIT-001): LogLevel ERROR + AUTHPRIV, pam_lastlog stripped,
# wtmp/btmp/lastlog symlinked to /dev/null. See the equivalent block in
# roles/redirector/tasks/ssh_ca.yml for the rationale.
- name: Deploy sshd OPSEC drop-in (LogLevel ERROR + AUTHPRIV)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-opsec.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by conduit relay_node role. Do not hand-edit.
      LogLevel ERROR
      SyslogFacility AUTHPRIV
  become: true
  notify: restart sshd

- name: Disable pam_lastlog in /etc/pam.d/sshd
  ansible.builtin.replace:
    path: /etc/pam.d/sshd
    regexp: '^(session\s+optional\s+pam_lastlog\.so.*)$'
    replace: '# \1   # OPSEC: disabled by conduit'
  become: true

- name: Neutralize wtmp/btmp/lastlog via /dev/null symlinks
  ansible.builtin.file:
    src: /dev/null
    dest: "{{ item }}"
    state: link
    force: true
  loop:
    - /var/log/wtmp
    - /var/log/btmp
    - /var/log/lastlog
  become: true

- name: Ensure /etc/systemd/journald.conf.d exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy journald OPSEC drop-in (volatile + size cap, all forwarders off)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-opsec.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by conduit relay_node role. Do not hand-edit.
      [Journal]
      Storage=volatile
      RuntimeMaxUse=50M
      ForwardToSyslog=no
      ForwardToKMsg=no
      ForwardToWall=no
      ForwardToConsole=no
  become: true
  notify: restart journald

- name: Remove any pre-existing persistent journal dir
  ansible.builtin.file:
    path: /var/log/journal
    state: absent
  become: true
  notify: restart journald
