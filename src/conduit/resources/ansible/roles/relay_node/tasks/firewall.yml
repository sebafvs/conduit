---

- name: Template nftables ruleset
  ansible.builtin.template:
    src: relay-nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: reload nftables

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Load nftables ruleset immediately
  ansible.builtin.command: nft -f /etc/nftables.conf
  become: true
  changed_when: true
