---

- name: Copy fail2ban filters from bundle
  ansible.builtin.copy:
    src: "{{ redirector_bundle_path }}/fail2ban/filter.d/{{ item }}"
    dest: "/etc/fail2ban/filter.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop:
    - redir-decoy.conf
    - redir-429.conf
  notify: restart fail2ban

- name: Copy fail2ban jail from bundle
  ansible.builtin.copy:
    src: "{{ redirector_bundle_path }}/fail2ban/jail.d/redirector.conf"
    dest: /etc/fail2ban/jail.d/redirector.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart fail2ban
