---

- name: Copy nftables ruleset from bundle
  ansible.builtin.copy:
    src: "{{ redirector_bundle_path }}/nftables/redirector.nft"
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: reload nftables

- name: Enable + start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Load nftables ruleset immediately (apply without reboot)
  ansible.builtin.command: nft -f /etc/nftables.conf
  become: true
  changed_when: true
